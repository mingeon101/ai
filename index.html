<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 친환경 미션 인증 데모</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 폰트 로드 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <!-- 아이콘 로드 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f0f8ff; /* 하늘색 배경 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
            padding: 20px;
        }
        .main-container {
            background-color: white;
            max-width: 500px;
            width: 100%;
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .mission-item {
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid #e2e8f0;
        }
        .mission-item:hover {
            border-color: #34d399;
            box-shadow: 0 4px 10px rgba(52, 211, 153, 0.2);
            transform: translateY(-2px);
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content-ai {
            transition: all 0.3s ease-in-out;
            max-height: 90vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-green-700">AI 미션 인증 데모</h1>
            <p class="text-gray-500 mt-2">친환경 미션을 선택하고 사진을 업로드하여 AI 인증을 경험해 보세요!</p>
        </header>

        <div id="mission-list-container" class="space-y-4">
            <!-- 미션 목록이 여기에 동적으로 로드됩니다. -->
        </div>

        <div id="user-status" class="mt-6 p-3 text-sm rounded-lg text-gray-600 bg-gray-100">
            <p id="auth-status-display">앱 초기화 중...</p>
        </div>
    </div>
    
    <!-- 일반 알림 모달 -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="bg-white p-6 rounded-xl shadow-lg w-11/12 max-w-sm text-center">
            <h3 id="modal-title" class="font-bold text-xl mb-3 text-gray-800">알림</h3>
            <p id="modal-message" class="text-gray-600 mb-6"></p>
            <button id="modal-close-btn" class="px-5 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition duration-150">확인</button>
        </div>
    </div>

    <!-- AI 미션 인증 상세 모달 (핵심 기능) -->
    <div id="ai-auth-modal-overlay" class="modal-overlay hidden opacity-0 transition-opacity duration-300">
        <div class="modal-content-ai bg-white rounded-xl shadow-2xl p-6 w-11/12 max-w-md transform scale-95 transition-transform duration-300">
            <div class="flex justify-between items-start">
                <h3 id="auth-mission-title" class="text-2xl font-bold text-green-700">미션 상세</h3>
                <button class="text-gray-500 hover:text-gray-700 text-3xl leading-none" onclick="closeAIAuthModal()">&times;</button>
            </div>
            <p id="auth-mission-desc" class="text-gray-600 mt-2 mb-4 text-sm border-b pb-3 text-left"></p>

            <div id="auth-content">
                <label for="mission-image" class="block text-left text-sm font-medium text-gray-700 mb-2">
                    미션 인증 사진 업로드 (5MB 이하)
                </label>
                <input type="file" id="mission-image" accept="image/*" class="w-full p-2 border border-gray-300 rounded-lg mb-4 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100 cursor-pointer">
                
                <img id="image-preview" class="w-full h-48 object-cover rounded-lg border border-gray-200 hidden mb-4" alt="업로드된 이미지 미리보기">

                <button id="verify-mission-btn" class="w-full px-4 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition duration-150 shadow-md">
                    AI로 미션 인증하기
                </button>
                
                <div id="auth-status-area" class="mt-4 p-3 rounded-lg text-sm text-left hidden border border-transparent">
                    <p id="auth-message" class="font-medium"></p>
                </div>
            </div>

            <button class="w-full mt-6 px-4 py-2 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 transition duration-150" onclick="closeAIAuthModal()">닫기</button>
        </div>
    </div>
    
    <!-- Firebase SDK (익명 인증을 위해 필요) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        
        // --- 환경 변수 및 상수 ---
        const AI_INCREMENT = 50; // 인증 성공 시 가상으로 지급할 보상 값
        const MISSION_DATA = [
            { icon: '🚶‍♂️‍➡️', title: '플로깅 실천하기', description: '조깅하면서 주운 쓰레기 봉투와 주변 환경 사진을 인증하세요.', aiEnabled: true },
            { icon: '🥤', title: '텀블러 사용 인증', description: '카페 또는 사무실에서 텀블러를 사용하여 음료를 마시는 사진을 인증하세요.', aiEnabled: true },
            { icon: '🪜', title: '계단 이용 인증', description: '건물 계단을 이용하는 모습이나 계단 번호가 보이는 사진을 인증하세요.', aiEnabled: true },
            { icon: '🔌', title: '플러그 뽑기 인증', description: '사용하지 않는 가전제품의 플러그가 뽑혀있는 콘센트 사진을 인증하세요.', aiEnabled: true },
        ];

        // Canvas 환경 변수에서 Firebase 설정 가져오기 (필수)
        const firebaseConfig = {
            apiKey: "AIzaSyBwr1j5-SokeoEdaBL0uGejzZLLYW4IHLg",
            authDomain: "eco-vision-db.firebaseapp.com",
            databaseURL: "https://eco-vision-db-default-rtdb.firebaseio.com",
            projectId: "eco-vision-db",
            storageBucket: "eco-vision-db.firebasestorage.app",
            messagingSenderId: "340035289683",
            appId: "1:340035289683:web:dd65ba6bab22e91029fca6",
            measurementId: "G-8ZN69L0H1C"
        };

        let auth, userId;
        let currentMission = { title: '', description: '' };
        
        // --- 헬퍼 함수 ---
        function showModal(title, message) {
            document.getElementById("modal-title").textContent = title;
            document.getElementById("modal-message").textContent = message;
            document.getElementById("modal-overlay").classList.remove('hidden');
        }

        window.closeAIAuthModal = function() {
            const aiAuthModalOverlay = document.getElementById('ai-auth-modal-overlay');
            aiAuthModalOverlay.classList.add('opacity-0');
            aiAuthModalOverlay.querySelector('.modal-content-ai').classList.add('scale-95');
            setTimeout(() => {
                aiAuthModalOverlay.classList.add('hidden');
            }, 300);
        }
        
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }
        
        // --- UI 및 이벤트 핸들러 ---
        
        function loadMissions() {
            const container = document.getElementById('mission-list-container');
            container.innerHTML = '';
            
            MISSION_DATA.forEach(mission => {
                if (!mission.aiEnabled) return; // AI 인증 미션만 표시
                
                const div = document.createElement('div');
                div.className = 'mission-item p-4 rounded-xl shadow-sm bg-white';
                
                const titleEscaped = mission.title.replace(/'/g, "\\'");
                const descEscaped = mission.description.replace(/'/g, "\\'");

                div.setAttribute('onclick', `handleMissionClick('${mission.icon} ${titleEscaped}', '${descEscaped}')`);
                div.innerHTML = `
                    <h3 class="font-bold text-lg text-gray-800 flex items-center">
                        <span class="text-2xl mr-3">${mission.icon}</span> ${mission.title}
                        <span class="ml-auto text-xs font-bold text-blue-600 bg-blue-100 px-3 py-1 rounded-full">AI 인증</span>
                    </h3>
                    <p class="text-sm text-gray-500 mt-1 text-left pl-10">${mission.description}</p>
                `;
                container.appendChild(div);
            });
        }

        window.handleMissionClick = function(title, description) {
            if (!userId) {
                showModal("준비 중", "앱 초기화 중입니다. 잠시 후 다시 시도해 주세요.");
                return;
            }
            
            currentMission = { title, description };
            
            // 모달 내부 요소 업데이트 및 초기화
            document.getElementById('auth-mission-title').textContent = title;
            document.getElementById('auth-mission-desc').textContent = description;
            
            document.getElementById('mission-image').value = '';
            document.getElementById('image-preview').classList.add('hidden');
            document.getElementById('image-preview').src = '';
            
            const authStatusArea = document.getElementById('auth-status-area');
            authStatusArea.classList.add('hidden');
            authStatusArea.classList.remove('bg-green-100', 'bg-red-100');
            document.getElementById('auth-message').textContent = '';

            const verifyMissionBtn = document.getElementById('verify-mission-btn');
            verifyMissionBtn.disabled = false;
            verifyMissionBtn.textContent = 'AI로 미션 인증하기';
            verifyMissionBtn.classList.remove('bg-gray-400');
            verifyMissionBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');

            // 모달 표시
            const aiAuthModalOverlay = document.getElementById('ai-auth-modal-overlay');
            aiAuthModalOverlay.classList.remove('hidden');
            setTimeout(() => {
                aiAuthModalOverlay.classList.remove('opacity-0');
                aiAuthModalOverlay.querySelector('.modal-content-ai').classList.remove('scale-95');
            }, 10);
        }

        // --- AI 인증 핵심 로직 ---
        async function verifyMissionWithAI(base64ImageData, mimeType, missionTitle, missionDescription) {
            const systemPrompt = `당신은 사용자의 친환경 미션 수행을 인증하는 AI 전문가입니다. 
            다음 규칙에 따라 응답하세요:
            1. 사용자가 업로드한 이미지와 요청된 미션 내용이 일치하는지, 미션 수행의 증거가 명확한지 판단해야 합니다.
            2. 응답은 오직 JSON 형식이어야 합니다. 텍스트나 추가 설명은 포함하지 마세요.
            3. JSON 형식: {"verification_result": boolean, "reason_kr": string}
            4. 'verification_result'가 true이면 미션이 성공적으로 인증되었음을 의미합니다.
            5. 'verification_result'가 false이면 인증에 실패했음을 의미합니다.
            6. 'reason_kr'은 한국어로 된 판단 이유입니다.`;

            const userQuery = `미션 제목: '${missionTitle}'. 미션 내용: '${missionDescription}'.
            이 이미지가 주어진 미션을 성공적으로 수행했음을 입증하는 충분한 증거를 제공합니까?`;

            const apiKey = ""; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

            const payload = {
                contents: [
                    {
                        role: "user",
                        parts: [
                            { text: userQuery },
                            {
                                inlineData: {
                                    mimeType: mimeType,
                                    data: base64ImageData
                                }
                            }
                        ]
                    }
                ],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            "verification_result": { "type": "BOOLEAN" },
                            "reason_kr": { "type": "STRING" }
                        }
                    }
                }
            };

            let response;
            const maxRetries = 3;
            let delay = 1000;

            for (let i = 0; i < maxRetries; i++) {
                try {
                    response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        const result = await response.json();
                        const jsonText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (jsonText) {
                            let cleanJsonText = jsonText.replace(/```json\s*/g, '').replace(/\s*```/g, '');
                            const parsedJson = JSON.parse(cleanJsonText);
                            return parsedJson; // verification_result와 reason_kr을 모두 반환
                        }
                    }
                } catch (error) {
                    if (i === maxRetries - 1) {
                        throw new Error('AI 미션 인증 서버 응답을 받을 수 없습니다.');
                    }
                }

                if (i < maxRetries - 1) {
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2; // Exponential backoff
                }
            }
        }
        
        // --- 메인 초기화 로직 ---

        document.addEventListener('DOMContentLoaded', async () => {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            
            const authStatusDisplay = document.getElementById("auth-status-display");
            const modalOverlay = document.getElementById("modal-overlay");
            const modalCloseBtn = document.getElementById("modal-close-btn");
            const missionImageInput = document.getElementById('mission-image');
            const imagePreview = document.getElementById('image-preview');
            const verifyMissionBtn = document.getElementById('verify-mission-btn');
            const authStatusArea = document.getElementById('auth-status-area');
            const authMessage = document.getElementById('auth-message');
            
            // 익명으로 로그인하여 userId 확보
            try {
                authStatusDisplay.textContent = '사용자 인증 중...';
                await signInAnonymously(auth);
                
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        authStatusDisplay.textContent = `익명 사용자 ID: ${userId.substring(0, 10)}... (인증 준비 완료)`;
                        loadMissions();
                    }
                });
            } catch(e) {
                authStatusDisplay.textContent = '인증 오류: AI 기능을 사용할 수 없습니다.';
                console.error("Firebase Anonymous Sign-In Error:", e);
            }
            
            // 일반 모달 닫기
            modalCloseBtn.addEventListener('click', () => modalOverlay.classList.add('hidden'));

            // 이미지 미리보기
            missionImageInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        imagePreview.src = e.target.result;
                        imagePreview.classList.remove('hidden');
                    };
                    reader.readAsDataURL(file);
                } else {
                    imagePreview.classList.add('hidden');
                    imagePreview.src = '';
                }
                // 상태 초기화
                authStatusArea.classList.add('hidden');
                authStatusArea.classList.remove('bg-green-100', 'bg-red-100', 'bg-yellow-100', 'border-green-400', 'border-red-400');
                authMessage.textContent = '';
                verifyMissionBtn.disabled = false;
                verifyMissionBtn.textContent = 'AI로 미션 인증하기';
                verifyMissionBtn.classList.remove('bg-gray-400');
                verifyMissionBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
            });

            // AI 인증 실행 버튼
            verifyMissionBtn.addEventListener('click', async () => {
                if (!userId) {
                    closeAIAuthModal();
                    showModal("오류", "사용자 인증이 완료되지 않아 미션을 인증할 수 없습니다.");
                    return;
                }

                const file = missionImageInput.files[0];
                if (!file) {
                    authStatusArea.classList.remove('hidden');
                    authStatusArea.classList.add('bg-yellow-100', 'border-yellow-400');
                    authMessage.style.color = '#b88500';
                    authMessage.textContent = '인증을 위해 사진 파일을 선택해주세요.';
                    return;
                }

                if (file.size > 5 * 1024 * 1024) {
                    authStatusArea.classList.remove('hidden');
                    authStatusArea.classList.add('bg-red-100', 'border-red-400');
                    authMessage.style.color = '#dc2626';
                    authMessage.textContent = '파일 크기가 너무 큽니다. 5MB 이하의 파일을 업로드해주세요.';
                    return;
                }

                // 1. UI 로딩 상태 변경
                verifyMissionBtn.disabled = true;
                verifyMissionBtn.textContent = 'AI 분석 중...';
                verifyMissionBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                verifyMissionBtn.classList.add('bg-gray-400');
                
                authStatusArea.classList.remove('hidden', 'bg-green-100', 'bg-red-100', 'bg-yellow-100', 'border-green-400', 'border-red-400', 'border-yellow-400');
                authStatusArea.classList.add('bg-gray-100', 'border-gray-400');
                authMessage.style.color = '#4a5568';
                authMessage.textContent = '사진을 분석하고 있습니다. 잠시만 기다려주세요...';

                const base64Data = await fileToBase64(file);

                // 2. AI 인증 실행
                try {
                    const result = await verifyMissionWithAI(base64Data, file.type, currentMission.title, currentMission.description);
                    
                    authStatusArea.classList.remove('bg-gray-100', 'border-gray-400');
                    
                    if (result.verification_result) {
                        authStatusArea.classList.add('bg-green-100', 'border-green-400');
                        authMessage.style.color = '#10b981';
                        authMessage.innerHTML = `
                            ✅ <span class="font-bold">미션 인증 성공!</span> (가상 보상 +${AI_INCREMENT} 획득)
                            <br>
                            <span class="font-normal text-xs mt-1 block">(${result.reason_kr})</span>
                        `;
                        
                        // 성공 메시지 후 모달 자동 닫기
                        setTimeout(closeAIAuthModal, 3000);

                    } else {
                        authStatusArea.classList.add('bg-red-100', 'border-red-400');
                        authMessage.style.color = '#dc2626';
                        authMessage.innerHTML = `
                            ❌ <span class="font-bold">미션 인증 실패.</span>
                            <br>
                            <span class="font-normal text-xs mt-1 block">(${result.reason_kr})</span>
                            <span class="font-normal text-xs mt-1 block">미션 내용에 맞는 사진을 다시 업로드해 주세요.</span>
                        `;
                    }

                } catch (error) {
                    console.error("AI 인증 오류:", error);
                    authStatusArea.classList.remove('bg-gray-100', 'border-gray-400');
                    authStatusArea.classList.add('bg-red-100', 'border-red-400');
                    authMessage.style.color = '#dc2626';
                    authMessage.innerHTML = '⚠️ <span class="font-bold">API 호출 중 오류가 발생했습니다.</span> 잠시 후 다시 시도해 주세요.';
                } finally {
                    // 3. UI 상태 복구
                    verifyMissionBtn.disabled = false;
                    verifyMissionBtn.textContent = 'AI로 미션 인증하기';
                    verifyMissionBtn.classList.remove('bg-gray-400');
                    verifyMissionBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                }
            });
        });
    </script>
</body>
</html>
